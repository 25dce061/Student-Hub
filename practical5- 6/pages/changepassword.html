<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Student Hub</title>

    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../js/theme.js"></script>
</head>

<body class="change-password-page">

    <!-- Header Frame -->
    <iframe src="header.html"
            class="header-frame"
            title="Student Hub Header"></iframe>


    <!-- Top Action Bar -->
    <div class="top-action-bar">

        <a href="../index.html" class="home-nav-btn">
            🏠 Home
        </a>

        <button id="theme-toggle"
                class="theme-btn-compact"
                type="button"
                aria-label="Switch to dark theme">
            🌙 Dark Mode
        </button>

    </div>


    <!-- Navigation Bar -->
    <nav id="main-nav" aria-label="Main navigation">

        <button id="menu-toggle"
                class="mobile-menu-btn"
                type="button"
                aria-expanded="false"
                aria-label="Toggle navigation">
            ☰ Menu
        </button>

        <div id="nav-links">

            <a href="dashboard.html">DASHBOARD</a>
            <a href="course.html">COURSES</a>
            <a href="event.html">EVENTS</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">CONTACT</a>
            <a href="profile.html">PROFILE</a>
            <a href="setting.html">SETTING</a>
            <a href="login.html">LOGIN</a>

        </div>

    </nav>


    <!-- Page Title -->
    <h1 class="page-title">
        CHANGE PORTAL PASSWORD
    </h1>


    <!-- Password Form -->
    <main class="change-password-main">

        <div class="change-password-box">

            <form onsubmit="event.preventDefault(); alert('Password successfully updated!'); window.location.href='dashboard.html';">


                <!-- Current Password -->
                <div class="password-field">

                    <label for="oldpassword">
                        Current Password:
                    </label>

                    <input type="password"
                           id="oldpassword"
                           placeholder="Enter current password"
                           required>

                </div>


                <!-- New Password -->
                <div class="password-field">

                    <label for="newpassword">
                        New Password:
                    </label>

                    <input type="password"
                           id="newpassword"
                           placeholder="Min 8 characters (A-Z, a-z, 0-9)"
                           required>

                </div>


                <!-- Confirm Password -->
                <div class="password-field confirm-field">

                    <label for="confirmpassword">
                        Confirm New Password:
                    </label>

                    <input type="password"
                           id="confirmpassword"
                           placeholder="Re-enter new password"
                           required>

                </div>


                <!-- Buttons -->
                <div class="password-buttons">

                    <button type="submit" class="update-password-btn">
                        Update Password
                    </button>

                    <a href="dashboard.html" class="cancel-password-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        &copy; 2026 STUDENT HUB &bull;
        CHARUSAT University &bull;
        All Rights Reserved.
    </footer>

</body>

</html>
