<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>LOGIN PAGE</title>
</head>

<body style="text-align: center;">

    <iframe src="header.html" style="width:100%; height:150px; border:none;"></iframe>

    <div class="login-container">

        <form action="../index.html" method="get">
            
            
            <h1 style="background-color:  #294d68; color: white;">LOGIN</h1>
            <br>
            <br><br>
            <br>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>
            <br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <br>

            <button type="submit" class="submit-button" onclick="login()">
                Login
            </button>
            <p id="Message"></p>
            <script src="../js/script.js"></script>
            <br>
            
            <a href="changepassword.html">forgot password?</a>
        </form>

    </div>

</body>
</html>
